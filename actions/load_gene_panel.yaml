---
name: load_gene_panel
description: "Load a gene_panel into Scout from a file inside the Scout container"
runner_type: remote-shell-script
entry_point: load_gene_panel.sh
enabled: true

parameters:
  hosts:
    type: string
    description: "Remote host running the Scout Docker container"
    required: true
    default: "{{ config_context.scout_host }}"

  cwd:
    type: string
    description: "Path to directory with scout docker-compose"
    required: true
    default: "{{ config_context.scout_cwd }}"

  timeout:
    type: integer
    description: "timeout for loading a case into scout"
    required: true
    default: 1800

  gene_panel_file:
    type: string
    description: "Path to gene panel file on the remote host"
    required: true
    position: 0
