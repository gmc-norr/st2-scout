---
name: export_case
description: "Export a case from Scout in json format"
runner_type: remote-shell-script
entry_point: export_case.sh
enabled: true

parameters:
  hosts:
    type: string
    description: "Remote host running the Scout Docker container"
    required: true
    default: "{{ config_context.scout_host }}"

  cwd:
    type: string
    description: "Path to directory with scout docker-compose"
    required: true
    default: "{{ config_context.scout_cwd }}"

  timeout:
    type: integer
    description: "timeout for loading a case into scout"
    required: true
    default: 1800

  case_id:
    type: string
    description: "Case ID"
    required: true
    position: 0
