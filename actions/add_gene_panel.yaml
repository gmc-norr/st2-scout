---
name: add_gene_panel
pack: scout
description: Add gene panel to scout
runner_type: orquesta
entry_point: workflows/.yaml
enabled: true

parameters:
  gene_panel_id:
    description: ID of the gene panel from iGene
    type: string
    required: true
  scout_institute:
    description: Which institute in Scout to add the panel to
    type: string
    required: true
  output_path:
    description: Direcotry to save gene panel text file
    default:  "{{ config_context.gene_panel_dir }}"