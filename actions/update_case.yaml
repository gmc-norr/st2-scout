---
name: update_case
description: "Update a case in Scout with a new vcf"
runner_type: remote-shell-script
entry_point: update_case.sh
enabled: true

parameters:
  hosts:
    type: string
    description: "Remote host running the Scout Docker container"
    required: true
    default: "{{ config_context.scout_host }}"

  cwd:
    type: string
    description: "Path to directory with scout docker-compose"
    required: true
    default: "{{ config_context.scout_cwd }}"

  timeout:
    type: integer
    description: "timeout for loading a case into scout"
    required: true
    default: 1800

  case_id:
    type: string
    description: "ID of the case in Scout to update"
    required: true
    position: 0

  vcf_path:
    type: string
    description: "Path to vcf on the remote host"
    required: true
    position: 1

  cancer:
    type: boolean
    description: "If the case (and therefore the vcf) is cancer-related"
    required: true
    default: false
    position: 2

  sv:
    type: boolean
    description: "If the variants are structural"
    required: true
    default: false
    position: 3
