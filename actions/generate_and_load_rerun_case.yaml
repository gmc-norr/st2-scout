---
name: generate_and_load_rerun_case
pack: scout
description: Generate load configs and upload to scout for rerun case
runner_type: orquesta
entry_point: workflows/generate_and_load_rerun_case.yaml
enabled: true

parameters:
  case_id:
    description: wonderwords generated case-id for case
    type: string
    required: true
  sample_id:
    description: sample id in case
    type: string
    required: true
  pipeline:
    description: name of analysis pipeline, e.g. nf-core/raredisease
    type: string
    required: true
  analysis_id:
    description: cleve analysis-id
    type: string
    required: true
  output_path:
    description: output path for scout load config
    type: string
    required: true
  rerun:
    description: Specifies if sample is rerun, and what kind of rerun it is.
    type: string
    required: false
    enum:
      - "CNV"
      - null
  temp_path:
    description: The dir where the rerun was done
    type: string
    required: true
